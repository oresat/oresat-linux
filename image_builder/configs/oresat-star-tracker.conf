# OreSat Star Tracker board image builder config

release="11.7"
image_type="minimal"
##
##Debootstrap: https://wiki.debian.org/Debootstrap
##
##debootstrap --arch=${deb_arch} --include=${deb_include} --exclude=${deb_exclude} \
##--components=${deb_components} --foreign ${deb_codename} /tmp/tmp.dir/ http://${deb_mirror}
##
deb_distribution="debian"
deb_codename="bookworm"
deb_arch="armhf"
deb_mirror=""
deb_components="main contrib non-free non-free-firmware"

# packages to install when debootstrap
deb_include="                           \
        autoconf                        \
        automake                        \
        bison                           \
        btrfs-progs                     \
        build-essential                 \
        ca-certificates                 \
        can-utils                       \
        cloud-guest-utils               \
        cmake                           \
        cpufrequtils                    \
        dkms                            \
        dh-dkms                         \
        fakeroot                        \
        de
        firmware-misc-nonfree           \
        g++                             \
        gcc                             \
        gfortran                        \
        git                             \
        gnupg                           \
        groff                           \
        initramfs-tools                 \
        kitty-terminfo                  \
        libaec0                         \
        libatlas-base-dev               \
        libblas-dev                     \
        libblosc1                       \
        libcairo2-dev                   \
        libeigen3-dev                   \
        libfreetype6-dev                \
        libgif7                         \
        libgirepository-1.0-1           \
        libjpeg-dev                     \
        libjxr0                         \
        liblcms2-2                      \
        libopenblas-dev                 \
        libopenjp2-7                    \
        libpng-dev                      \
        libtiff6                        \
        libyaml-dev                     \
        libzopfli1                      \
        linux-base                      \
        locales                         \
        m4                              \
        make                            \
        net-tools                       \
        nginx                           \
        openssh-server                  \
        patch                           \
        pkg-config                      \
        python3                         \
        python3-all                     \
        python3-dev                     \
        python3-pip                     \
        python3-setuptools              \
        python3-wheel                   \
        rsync                           \
        ssl-cert                        \
        sudo                            \
        vim                             \
        wget                            \
        zstd                            \
"

# package to not install when debootstrap
deb_exclude="           \
        avahi-daemon    \
        ifupdown        \
        man-db          \
        manpages        \
        manpages-dev    \
"


# packages to install when chroot that can fail in debootstrap
deb_additional_pkgs="   \
        libpam-systemd  \
        net-tools       \
"

rfs_username="debian"
rfs_fullname="OreSat Developer"
rfs_password="temppwd"
rfs_hostname="oresat-star-tracker"
rfs_root_password="root"
rfs_default_locale="en_US.UTF-8"
rfs_etc_dogtag="OreSat Star Tracker Board Debian Bookworm Image"
rfs_console_banner="Support: https://github.com/oresat/oresat-linux"
rfs_console_user_pass="enable"
rfs_ssh_banner="Support: https://github.com/oresat/oresat-linux"
rfs_ssh_user_pass="enable"

repo_rcnee="enable"
repo_rcnee_arch="armhf"
repo_rcnee_pkg_list="                       \
        bb-u-boot-am335x-evm                \
        bbb.io-kernel-6.12-ti-am335x        \
        bbb.io-keyring                      \
        linux-headers-6.12.34-ti-arm32-r12  \
        ti-pru-cgt-v2.3                     \
        ti-pru-software-v6.0                \
"

chroot_COPY_SETUP_SDCARD="enable"
chroot_before_hook=""
chroot_after_hook=""
chroot_script="oresat-chroot.sh"
chroot_tarball="enable"
early_chroot_script="oresat-early-chroot.sh"
keep_ssh_keys="enable"
