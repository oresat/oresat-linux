#genimage.cfg
image sdcard.img {
  hdimage {
    partition-table-type = "gpt"
  }
  partition MLO {
    in-partition-table = "no"
    image = "MLO"
    offset = 128K
  }
  partition u-boot {
    in-partition-table = "no"
    image = "u-boot-dtb.img"
    offset = 384K
  }
  partition boot {
    bootable = "true"
    partition-type-uuid = "fat32"
    image = "boot.vfat"
    offset = 4M
  }
  partition rootfs {
    partition-type-uuid = "root-arm"
    image = "rootfs.ext4"
  }
}
image boot.vfat {
  size = 36M
  vfat {
    label = "boot"
  }
  mountpoint = "fs-bootfs"
}
image rootfs.ext4 {
  size = 4G
  ext4 {
    label = "root"
  }
  mountpoint = "fs-rootfs"
}
